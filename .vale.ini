# Plain-language checks for the docs. Styles download with `vale sync`.
StylesPath = .vale/styles
MinAlertLevel = warning
Packages = write-good, proselint

Vocab = Project

[*.md]
BasedOnStyles = Vale, write-good, proselint
# British spelling is checked by people, not by Vale's US dictionary.
Vale.Spelling = NO
# "very easy" style intensifiers are what we want flagged; E-Prime is too strict.
write-good.E-Prime = NO
