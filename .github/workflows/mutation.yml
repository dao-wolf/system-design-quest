name: Mutation

on:
  pull_request:
    paths: ["web/engine.js", "tests/engine.test.mjs", "stryker.config.mjs", ".github/workflows/mutation.yml"]
  push:
    branches: [main]
    paths: ["web/engine.js", "tests/engine.test.mjs", "stryker.config.mjs", ".github/workflows/mutation.yml"]
  schedule:
    - cron: "0 6 * * 1" # Mondays: a full run, which incremental runs skip
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mutation:
    name: Mutation score
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Reuse the last results from main, so PRs only re-test what changed. Only with the same unit tests:
      # the command runner reports them as one test, so Stryker can't see them change and would keep
      # mutants "survived" that new tests now kill. New or changed tests mean a full run.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: reports/stryker-incremental.json
          key: stryker-${{ github.ref_name }}-${{ hashFiles('tests/engine.test.mjs') }}-${{ github.sha }}
          restore-keys: |
            stryker-main-${{ hashFiles('tests/engine.test.mjs') }}-
      - name: Stryker
        run: pnpm ${{ github.event_name == 'schedule' && 'mutate:full' || 'mutate' }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: mutation-report
          path: reports/mutation/
          retention-days: 14
