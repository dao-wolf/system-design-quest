name: Release

# A v* tag builds the element, tests it, and publishes it two ways:
# - an immutable GitHub release: the files, a SHA256SUMS file and signed build provenance for each file;
# - the npm package @daowolf/system-design-quest, staged by trusted publishing with provenance. It goes
#   public only when a maintainer approves it with two-factor authentication (npm stage approve, or on
#   npmjs.com). Sites pin a version and their lockfile checks its hash.
# Order: the GitHub release is created as a draft, the package is staged on npm, and the release is
# published last. Publishing makes the release immutable, so if npm fails first, only a draft is left to
# delete before re-running, and the version number isn't burned.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Check the tag matches package.json
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(node -p 'require("./package.json").version')
          if [ "$TAG" != "v$version" ]; then
            echo "::error::Tag $TAG doesn't match package.json version $version."
            exit 1
          fi
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - run: pnpm install --frozen-lockfile
      - run: pnpm gate && pnpm test && pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm e2e
      - name: Collect the release files
        run: |
          mkdir release
          cp dist/element.js dist/element.js.map dist/style.css dist/chapters.json release/
          (cd release && sha256sum element.js element.js.map style.css chapters.json > SHA256SUMS)
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: release/
          retention-days: 7
      # The npm package holds the same built files (package.json "files"), packed once here so the
      # publish job stages exactly what was tested.
      - name: Pack the npm package
        run: |
          mkdir package
          pnpm pack --pack-destination package
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package
          path: package/
          retention-days: 7

  release:
    name: Draft the GitHub release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: release
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release/*
      # A draft until npm has the package: see "Publish the GitHub release" below.
      - name: Create the release as a draft
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        # On a re-run the draft already exists: keep it. The last job checks its files.
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::notice::A release for $TAG already exists; keeping it."
            exit 0
          fi
          gh release create "$TAG" release/* --repo "$GITHUB_REPOSITORY" --draft --title "$TAG" --generate-notes --verify-tag

  npm:
    name: Stage on npm
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write # trusted publishing: npm checks this workflow's GitHub identity, so no token is stored
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package
          path: package
      # Node 24's npm (11.19 or later) supports trusted publishing and npm stage.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      # Staged, never published directly: the package's trusted publisher allows only npm stage publish.
      # The leading ./ matters: npm reads "package/x.tgz" as the GitHub repo shorthand "user/repo".
      - name: Stage the package
        run: npm stage publish ./package/*.tgz --provenance --access public

  publish:
    name: Publish the GitHub release
    needs: npm
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: release
      # The draft must hold exactly the files this run built.
      - name: Check the draft's files
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir draft
          diff <(cd release && sha256sum -- * | sort) <(cd draft && sha256sum -- * | sort)
      - name: Publish the draft
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false
